name: Build Hexo Site

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # job 容器与 gitea 在同一个 docker 网络，所以可以直接用 gitea:3000
      - name: Checkout repository
        run: git clone --depth 1 "http://oauth2:${{ secrets.GITHUB_TOKEN }}@gitea:3000/${{ gitea.repository }}.git" .

      - name: Enable pnpm via corepack
        run: corepack enable && pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Deploy to pages branch
        run: |
          set -e
          mkdir -p /tmp/site
          cp -a public/. /tmp/site/
          cd /tmp/site
          git init -b pages
          git config --global user.name "Gitea Actions"
          git config --global user.email "actions@gitea"
          git add -A
          git commit -m "Deploy site: ${{ gitea.sha }}"
          git push --force "http://oauth2:${{ secrets.GITHUB_TOKEN }}@gitea:3000/${{ gitea.repository }}.git" HEAD:pages
